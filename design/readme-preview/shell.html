<title>QOT Readme Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: plugin tabs on top; each plugin laid out like its WordPress.org page — banner, icon and name, short description, then text column with a details sidebar */
:root {
  --bg: #ffffff; --band: #f6f7f7; --fg: #1e1e1e; --muted: #50575e; --line: #dcdcde;
  --link: #3858e9; --ok: #00703c; --bad: #b32d2e; --chip: #f0f0f1;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16181d; --band: #1e2127; --fg: #e9eaee; --muted: #a7acb6; --line: #343842;
  --link: #8fa4ff; --ok: #6fd39a; --bad: #ff8a8a; --chip: #262a32; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16181d; --band: #1e2127; --fg: #e9eaee; --muted: #a7acb6; --line: #343842;
  --link: #8fa4ff; --ok: #6fd39a; --bad: #ff8a8a; --chip: #262a32; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
.top { background: var(--band); border-bottom: 1px solid var(--line); }
.top .in, .wrap { max-width: 1060px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .in { padding-block: 18px 0; }
.top h1 { font-size: 20px; margin: 0 0 4px; }
.top p { margin: 0 0 14px; color: var(--muted); font-size: 14px; max-width: 70ch; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs button { font: inherit; font-size: 15px; background: none; border: 0; border-bottom: 3px solid transparent;
  color: var(--muted); padding: 10px 14px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--link); font-weight: 600; }
.tabs button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.wrap { padding-block: 24px 64px; }
a { color: var(--link); }
img { max-width: 100%; height: auto; display: block; }
.banner { width: 100%; border-radius: 4px; }
.title { display: flex; gap: 18px; align-items: center; margin-top: -40px; padding-left: 20px; position: relative; }
.icon { width: 96px; height: 96px; border-radius: 0; background: var(--bg); padding: 4px; flex: none; }
.title h1 { margin: 34px 0 0; font-size: 30px; line-height: 1.2; text-wrap: balance; }
.by { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.by span { color: var(--link); }
.short { font-size: 19px; color: var(--fg); margin: 18px 0 8px; max-width: 70ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; margin-top: 20px; align-items: start; }
.main { min-width: 0; }
.secnav { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 0; border-block: 1px solid var(--line); font-size: 15px; }
.secnav a { text-decoration: none; }
.sec { padding-top: 22px; scroll-margin-top: 16px; }
.sec h2 { font-size: 22px; margin: 0 0 10px; }
.sec h3 { font-size: 18px; margin: 26px 0 6px; }
.sec h4 { font-size: 16px; margin: 20px 0 4px; }
.sec p, .sec li { max-width: 70ch; }
.sec ul, .sec ol { padding-left: 1.4em; }
.sec li { margin: 4px 0; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--chip); padding: 1px 5px; border-radius: 3px; }
details { border: 1px solid var(--line); border-radius: 4px; margin: 10px 0; }
summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
details > div { padding: 0 16px 6px; }
.shots { display: grid; gap: 28px; }
.shots figure { margin: 0; display: grid; gap: 8px; }
.shots img { border: 1px solid var(--line); }
figcaption p { margin: 0; color: var(--muted); font-size: 15px; }
.upgrade { margin-top: 32px; padding: 14px 18px; background: var(--band); border: 1px dashed var(--line); border-radius: 4px; }
.upgrade h4 { margin: 8px 0 2px; }
.upgrade p { margin: 4px 0; }
.hint { color: var(--muted); font-size: 14px; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.side { display: grid; gap: 22px; font-size: 15px; min-width: 0; }
.meta { margin: 0; }
.meta div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.tags div { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tags span { background: var(--chip); border-radius: 3px; padding: 2px 8px; font-size: 14px; }
.checks ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.checks li { padding-left: 22px; position: relative; }
.checks li::before { position: absolute; left: 0; font-weight: 700; }
.checks li.ok::before { content: "✓"; color: var(--ok); }
.checks li.bad { color: var(--bad); }
.checks li.bad::before { content: "!"; color: var(--bad); }
.live, .src { margin: 0; }
.src code { font-size: 13px; word-break: break-all; }
.plugin[hidden] { display: none; }
@media (max-width: 760px) {
  .cols { grid-template-columns: 1fr; gap: 28px; }
  .title { margin-top: 12px; padding-left: 0; }
  .title h1 { margin-top: 0; font-size: 24px; }
  .icon { width: 72px; height: 72px; }
}
</style>
<div class="top"><div class="in">
  <h1>Readme preview</h1>
  <p>Each plugin's readme.txt laid out the way WordPress.org will show it. The text is read straight from the repo, so this is what visitors will read.</p>
  <div class="tabs" role="tablist" aria-label="Plugins">{{TABS}}</div>
</div></div>
<div class="wrap">{{PAGES}}</div>
<script>
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tabs button'));
  var pages = Array.prototype.slice.call(document.querySelectorAll('.plugin'));
  function show(slug, push) {
    if (!pages.some(function (p) { return p.dataset.slug === slug; })) slug = pages[0].dataset.slug;
    pages.forEach(function (p) { p.hidden = p.dataset.slug !== slug; });
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t.dataset.slug === slug ? 'true' : 'false'); });
    if (push) { try { history.replaceState(null, '', '#' + slug); } catch (e) {} window.scrollTo(0, 0); }
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.slug, true); }); });
  var start = (location.hash || '').slice(1);
  var owner = pages.filter(function (p) { return start && (p.dataset.slug === start || p.querySelector('[id="' + start + '"]')); })[0];
  show(owner ? owner.dataset.slug : '', false);
})();
</script>
